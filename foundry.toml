[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# via_ir = false  # NEVER enable this for development - it makes compilation 10x slower!
evm_version = "shanghai"
solc_version = "0.8.22"

# Speed optimizations for fast development
ffi = false
ast = false
build_info = false
extra_output = []
sparse_mode = false
fs_permissions = []

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Profile for production deployment (very slow but gas optimized)
[profile.production]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1000
via_ir = true  # Only use for production deployment
evm_version = "shanghai"
solc_version = "0.8.22"
